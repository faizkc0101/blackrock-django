<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages Example</title>
    
    <!-- Load Bootstrap 5 CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-3">
        {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}  <!-- Display the message content -->
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>  <!-- Correct button to dismiss the alert -->
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        
    </div>

    
    <!-- Load Bootstrap 5 JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Optional Auto-dismiss after 5 seconds -->
    <script>
        $(document).ready(function() {
            setTimeout(function() {
                $('.alert').alert('close');
            }, 5000);  // Auto-dismiss after 5 seconds
        });
    </script>
</body>
</html>
