{% load static %}
<header class="section-header">
    <section class="header-main border-bottom py-3">
        <div class="container-fluid">
            <div class="row align-items-center justify-content-between">

                <!-- Logo Section -->
                <div class="col-lg-2 col-md-3 col-sm-4 col-6 text-center">
                    <a href="{% url 'home' %}">
                        <img class="logo img-fluid" src="{% static 'images/blackrock.png' %}" alt="Logo" style="max-width: 150px;">
                    </a>
                </div>

                <!-- Categories Dropdown -->
                <div class="col-lg-2 col-md-3 d-none d-md-block text-center">
                    <div class="dropdown category-wrap">
                        <button type="button" class="btn btn-light dropdown-toggle" data-toggle="dropdown">
                            <i class="fa fa-bars"></i> Categories
                        </button>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="{% url 'store' %}">All Products</a>
                            {% for category in links %}
                                <a class="dropdown-item" href="{{ category.get_url }}">{{ category.category_name }}</a>
                            {% endfor %}
                        </div>
                    </div>
                </div>

                <!-- Search Bar -->
                <div class="col-lg-4 col-md-5 col-sm-6 col-8 text-center">
                    <form action="{% url 'search' %}" method="GET" class="input-group">
                        <input type="text" class="form-control" placeholder="Search products..." name="keyword" aria-label="Search">
                        <div class="input-group-append">
                            <button class="btn" type="submit" style="background-color: #6c757d; color: white; border: 1px solid #6c757d;">
                                <i class="fa fa-search"></i>
                            </button>                                                      
                        </div>
                    </form>
                </div>

                <!-- Icons and User Info -->
                <div class="col-lg-4 col-md-5 d-flex justify-content-center align-items-center">
                    <!-- Cart Icon -->
                        <a href="{% url 'cart' %}" class="widget-header text-dark d-flex flex-column align-items-center mx-2 position-relative">
                            <div class="icon icon-md rounded-circle border  p-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                                <i class="fa fa-shopping-cart" style="font-size: 1.5rem;"></i>
                            </div>
                            {% if cart_count > 0 %}
                            <span class="badge badge-pill badge-danger position-absolute" style="top: -5px; right: -10px; font-size: 0.8rem;">{{ cart_count }}</span>
                            {% endif %}
                        </a>

                        <!-- Favorites Icon -->
                        <a href="#" class="widget-header text-dark d-flex flex-column align-items-center mx-2 position-relative">
                            <div class="icon icon-md rounded-circle border  p-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                                <i class="fa fa-heart" style="font-size: 1.5rem;"></i>
                            </div>
                            <span class="badge badge-pill badge-danger position-absolute" style="top: -5px; right: -10px; font-size: 0.8rem;">1</span>
                        </a>

                    <!-- User Info Section -->
                    {% if user.is_authenticated %}
                    <div class="user-info text-center mx-2">
                        <span class="text-muted">Hi,{{ user.username }}</span>
                        <a href="{% url 'dashbord' %}" class="btn btn-outline-dark btn-sm mx-1">Dashboard</a>
                        <a href="{% url 'logout' %}" class="btn btn-outline-dark btn-sm">Logout</a>
                    </div>
                    {% else %}
                    <div class="user-info text-center mx-2">
                        <a href="{% url 'login' %}" class="btn btn-outline-dark btn-sm mx-1">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </a>
                        <a href="{% url 'register' %}" class="btn btn-outline-dark btn-sm">Register</a>
                    </div>
                    {% endif %}
                </div>

            </div> <!-- row -->
        </div> <!-- container-fluid -->
    </section>
</header>
