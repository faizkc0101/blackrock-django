{% extends "base.html" %}

{% block content %}
<section class="section-content padding-y">
    <div class="card mx-auto" style="max-width:520px; margin-top:40px;">
        <article class="card-body">
            <header class="mb-4"><h4 class="card-title">Verify Your Email</h4></header>
            <form action="{% url 'verify' %}" method="post">
                {% csrf_token %}
                {% include "includes/alerts.html" %}
                <div class="form-group">
                    <label for="otp">Enter OTP:</label>
                    <input type="text" name="otp" required class="form-control" placeholder="Enter OTP">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block"> Verify </button>
                </div>
            </form>
        </article>
    </div>
    <p class="text-center mt-4">back to signup page<a href="{% url 'register' %}">Log In</a></p>
</section>
{% endblock content %}
