{% load static %}
<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="cache-control" content="max-age=604800" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>BLACKrock</title>
    <meta name="description" content="Welcome to BLACKrock, your go-to store for quality products.">
    <meta name="keywords" content="BLACKrock, e-commerce, online store, quality products">
    
    <link href="{% static 'images/blackrock.png' %}" rel="shortcut icon" type="image/x-icon">

    <!-- jQuery -->
    <script src="{% static 'js/jquery-2.0.0.min.js' %}" type="text/javascript" onerror="this.onerror=null; this.src='{% static 'js/jquery-2.0.0.min.js' %}'"></script>

    <!-- Bootstrap4 files-->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}" type="text/javascript" onerror="this.onerror=null; this.src='{% static 'js/bootstrap.bundle.min.js' %}'"></script>
    <link href="{% static 'css/bootstrap.css' %}" rel="stylesheet" type="text/css"/>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.0/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font awesome 5 -->
    <link href="{% static 'fonts/fontawesome/css/all.min.css' %}" type="text/css" rel="stylesheet">

    <!-- Custom styles -->
    <link href="{% static 'css/ui.css' %}" rel="stylesheet" type="text/css"/>
    <link href="{% static 'css/responsive.css' %}" rel="stylesheet" media="only screen and (max-width: 1200px)" />
    <link href="{% static 'css/style.css' %}" type="text/css" rel="stylesheet">

    <!-- Custom JavaScript -->
    <script src="{% static 'js/script.js' %}" type="text/javascript"></script>

    
</head>
<body>

    {% include "includes/navbar.html" %}
    <!-- Here navbar and header -->

    {% block content %}
    <!-- Main content -->
    {% endblock %}

    {% include "includes/footer.html" %}
    <!-- Footer -->
    <script>
        $(document).ready(function() {
            // Automatically dismiss alerts after 5 seconds
            setTimeout(function() {
                $('.alert').alert('close');
            }, 5000);  // Change the time (in milliseconds) as needed
        });
    </script>
    <script type="text/javascript">
        $(document).ready(function() {
            // jQuery code
        });
        </script>

</body>
</html>
